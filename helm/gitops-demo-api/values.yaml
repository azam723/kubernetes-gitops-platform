replicaCount: 1

image:
  repository: 938379788528.dkr.ecr.ap-south-1.amazonaws.com/gitops-demo-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

healthCheck:
  path: /health
