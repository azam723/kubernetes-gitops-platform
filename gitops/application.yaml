apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/azam723/kubernetes-gitops-config.git
    targetRevision: main
    path: apps/gitops-demo-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
